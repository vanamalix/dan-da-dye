# Dandadan preset for dan-da-dye.
#
# All paths are relative to the data root (DANDADYE_DATA or --data), which lives
# OUTSIDE this repository. Nothing referenced here is committed: the pages and
# the official character art stay on your own disk.

series = "dandadan"
title = "Dandadan"

# Source pages: one sub-directory per chapter (e.g. src/150/000.jpg), or one per
# volume (src/v17/) whose filenames carry the chapter as "cNNN" and the page as "pNNN"
# (or "pNNN-pMMM" for a spread).
source_dir = "work/src"
volume_dir_pattern = '^v\d+$'
volume_chapter_regex = 'c(\d+(?:\.\d+)?)'
volume_page_regex = 'p(\d+)(?:-p?(\d+))?'   # "p134-p135" = spread

# Colour palette measured from official setting art (see palette.md in the data root).
palette = "palette/palette.json"

# Characters known to the pipeline. `art` = official setting art (transparent PNG),
# used both as Magi's character bank and for the colour reference sheet.
# `palette_key` = top-level key in palette.json.
[[characters]]
name = "Momo"
art = "palette/img/momo_pc/momo_pc.png"
palette_key = "Momo Ayase"
main_cast = true

