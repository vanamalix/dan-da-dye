[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dan-da-dye"
version = "0.1.0"
description = "Reference-guided manga colourisation pipeline for Apple Silicon (FLUX.2 Klein + LoRA via mflux)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    # Pillow 13 needs Python >= 3.13 (numbers._IntegralLike) and breaks mflux on 3.12.
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
# mflux is only needed for the colourise stage (Apple Silicon only).
mlx = ["mflux>=0.23"]
# The colourise stage on Linux (ROCm / CUDA) or CPU. torch is deliberately not listed:
# install it first from the index that matches the machine (ROCm, CUDA or CPU wheels).
# Minimums are the versions this was tested with (Flux2KleinPipeline, FLUX 3 modular blocks).
diffusers = ["diffusers>=0.43", "transformers>=5.24", "accelerate>=1.16", "peft>=0.22", "safetensors>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
dandadye = "dandadye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
